name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Full checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install tools and Python dependencies
        run: |
          cargo install checkle just --locked
          python -m venv tests/venv
          tests/venv/bin/pip install -r tests/requirements.txt pyright 'ruff==0.14.4'
          (cd docs && bun install --frozen-lockfile)
          echo "$PWD/tests/venv/bin" >> "$GITHUB_PATH"
      - name: Run full checks
        run: just check-ci

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - uses: hustcer/setup-nu@v3
        with:
          version: '0.114.1'
      - name: Install shells, tmux, just, and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes fish tmux zsh
          zsh -f -c 'autoload -Uz compaudit; compaudit' | xargs -r sudo chmod go-w
          cargo install just --locked
          python -m venv tests/venv
          tests/venv/bin/pip install -r tests/requirements.txt
      - name: Run Python test suite
        run: just itest
