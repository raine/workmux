name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  BIN_NAME: workmux

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS builds (use cargo directly)
          - os: macos-15
            target: aarch64-apple-darwin
            artifact: workmux-darwin-arm64
            use_cross: false
          - os: macos-15
            target: x86_64-apple-darwin
            artifact: workmux-darwin-amd64
            use_cross: false
          # Linux builds (use cross with musl for static linking)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: workmux-linux-amd64
            use_cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: workmux-linux-arm64
            use_cross: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@cross
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: |
          if [ "${{ matrix.use_cross }}" == "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi
      - name: Package
        run: |
          bin="target/${{ matrix.target }}/release/${BIN_NAME}"
          # Binary is already stripped via Cargo.toml profile.release.strip
          tar -C "$(dirname "$bin")" -czf ${{ matrix.artifact }}.tar.gz ${BIN_NAME}
          shasum -a 256 ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          generate_release_notes: true
          files: |
            *.tar.gz
            *.sha256

  publish-crate:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CARGO_HTTP_TIMEOUT: 60
          CARGO_NET_RETRY: 3
        shell: bash
        run: |
          set -euo pipefail

          : "${CARGO_REGISTRY_TOKEN:?CARGO_REGISTRY_TOKEN secret is required}"

          crate_version=$(cargo metadata --no-deps --format-version=1 \
            | jq -r '.packages[] | select(.name == "workmux") | .version')
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$crate_version" ]]; then
            printf 'Tag version %s does not match crate version %s\n' \
              "$tag_version" "$crate_version" >&2
            exit 1
          fi

          is_already_published() {
            grep -Eiq 'already (exists|published|uploaded)|is already uploaded' <<<"$1"
          }

          is_retryable_failure() {
            grep -Eiq \
              'timed? out|timeout|operation too slow|spurious network error|network failure|failed to (download|fetch|send)|error trying to connect|could not connect to server|connection (reset|refused|closed)|broken pipe|unexpected EOF|failure when receiving data|SSL connect error|TLS handshake|could not resolve (host|proxy)|temporary failure|service unavailable|bad gateway|gateway timeout|too many requests|rate.?limit|HTTP (429|5[0-9]{2})|got (429|5[0-9]{2})' \
              <<<"$1"
          }

          publish_with_retry() {
            local attempt=1
            local max_attempts=5
            local delay_seconds=10
            local output

            while ((attempt <= max_attempts)); do
              printf 'Publishing workmux %s, attempt %d of %d\n' \
                "$crate_version" "$attempt" "$max_attempts"

              if output=$(cargo publish --locked 2>&1); then
                printf '%s\n' "$output"
                return 0
              fi

              printf '%s\n' "$output" >&2
              if is_already_published "$output"; then
                printf 'workmux %s is already published\n' "$crate_version"
                return 0
              fi

              if ! is_retryable_failure "$output"; then
                printf 'cargo publish failed with a permanent error\n' >&2
                return 1
              fi

              if ((attempt == max_attempts)); then
                printf 'cargo publish failed after %d attempts\n' \
                  "$max_attempts" >&2
                return 1
              fi

              printf 'Retrying in %d seconds\n' "$delay_seconds" >&2
              sleep "$delay_seconds"
              attempt=$((attempt + 1))
              delay_seconds=$((delay_seconds * 2))
            done
          }

          publish_with_retry

  update-tap:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          repository: raine/homebrew-workmux
          token: ${{ secrets.RELEASE_TOKEN }}
          path: tap
      - name: Generate formula and push to tap
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          SHA_MAC_ARM=$(awk '{print $1}' workmux-darwin-arm64.sha256)
          SHA_MAC_INTEL=$(awk '{print $1}' workmux-darwin-amd64.sha256)
          SHA_LINUX_INTEL=$(awk '{print $1}' workmux-linux-amd64.sha256)
          SHA_LINUX_ARM=$(awk '{print $1}' workmux-linux-arm64.sha256)

          cat > tap/Formula/workmux.rb << EOF
          class Workmux < Formula
            desc "Opinionated workflow tool that orchestrates git worktrees and tmux"
            homepage "https://github.com/raine/workmux"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/raine/workmux/releases/download/v${VERSION}/workmux-darwin-arm64.tar.gz"
                sha256 "${SHA_MAC_ARM}"
              else
                url "https://github.com/raine/workmux/releases/download/v${VERSION}/workmux-darwin-amd64.tar.gz"
                sha256 "${SHA_MAC_INTEL}"
              end
            end

            on_linux do
              if Hardware::CPU.arm? && Hardware::CPU.is_64_bit?
                url "https://github.com/raine/workmux/releases/download/v${VERSION}/workmux-linux-arm64.tar.gz"
                sha256 "${SHA_LINUX_ARM}"
              else
                url "https://github.com/raine/workmux/releases/download/v${VERSION}/workmux-linux-amd64.tar.gz"
                sha256 "${SHA_LINUX_INTEL}"
              end
            end

            def install
              bin.install "workmux"
              generate_completions_from_executable(bin/"workmux", "completions")
            end

            test do
              assert_match version.to_s, shell_output("\#{bin}/workmux --version")
            end
          end
          EOF
          sed -i 's/^          //' tap/Formula/workmux.rb

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/workmux.rb
          git commit -m "workmux ${VERSION}"
          git pull --rebase
          git push
