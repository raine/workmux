[[check]]
name = "format-rust-check"
label = "format-rust"
mode = "rustfmt"
command = ["cargo", "fmt", "--all", "--", "--check"]

[[check]]
name = "format-python-check"
label = "format-python"
mode = "auto"
command = ["ruff", "format", "tests", "--check", "--quiet"]

[[check]]
name = "unit-tests"
mode = "cargo"
command = ["cargo", "test", "--bin", "workmux", "--message-format=json"]

[[check]]
name = "status-plugin-tests"
mode = "auto"
command = ["bun", "test", "tests/opencode_status_plugin.test.ts", "tests/opencode_status_plugin_v2.test.ts", "tests/opencode_status_tracker_v2.test.ts", "tests/pi_status_extension.test.ts"]

[[check]]
name = "ruff-check"
mode = "auto"
command = ["ruff", "check", "tests", "--quiet"]

[[check]]
name = "pyright"
mode = "auto"
command = ["bash", "-lc", "source tests/venv/bin/activate && pyright tests"]

[[check]]
name = "docs-check"
mode = "auto"
command = ["bash", "-lc", "cd docs && bun run format:check && node scripts/check-content.mjs"]

[[group]]
name = "all"
checks = ["format-rust-check", "format-python-check", "clippy", "unit-tests", "status-plugin-tests", "ruff-check", "pyright", "docs-check"]
